              .replace("max-w-lg", "max-w-sm")
              .replace("max-w-md", "max-w-sm")
              .replace("max-h-[90vh]", "max-h-[calc(100vh-2rem)]");
            popup.style.transform = "scale(0.9)";
            popup.style.transformOrigin = "center center";
            const header = popup.querySelector("div.relative.bg-gradient-to-br");
            if (header) {
              header.className = header.className.replace("px-6 py-8", "px-3 py-3").replace("px-4 py-4", "px-3 py-3");
              const icon = header.querySelector("div.mx-auto.mb-3");
              if (icon) icon.className = icon.className.replace("mb-3 h-14 w-14", "mb-1 h-8 w-8").replace("mb-2 h-10 w-10", "mb-1 h-8 w-8").replace("text-3xl", "text-xl").replace("text-2xl", "text-xl");
              const title = header.querySelector("h3");
              if (title) title.className = title.className.replace("mt-3 text-2xl", "mt-1 text-lg").replace("mt-2 text-xl", "mt-1 text-lg").replace("sm:text-3xl", "sm:text-xl").replace("sm:text-2xl", "sm:text-xl");
              const offer = header.querySelector("div.rounded-xl.border");
              if (offer) offer.className = offer.className.replace("p-5", "p-2").replace("p-3", "p-2");
              const price = header.querySelector("span.text-6xl");
              if (price) price.className = price.className.replace("text-6xl", "text-4xl").replace("text-5xl", "text-4xl").replace("sm:text-7xl", "sm:text-5xl").replace("sm:text-6xl", "sm:text-5xl");
              const list = header.querySelector("ul.mt-5");
              if (list) list.className = list.className.replace("mt-5 space-y-2", "mt-3 space-y-1");
              const actions = header.querySelector("div.mt-6");
              if (actions) actions.className = actions.className.replace("mt-6", "mt-2").replace("mt-3", "mt-2");
            }
          });
        };
        new MutationObserver(updateCount).observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true
        });
        updateCount();
      })();
    </script>
    <script>
      (() => {
        const removeVideoOptions = () => {
          document.querySelectorAll("video").forEach((video) => {
            video.controls = false;
            video.removeAttribute("controls");

            const frame = video.parentElement;
            if (!frame) return;

            Array.from(frame.children).forEach((element) => {
              if (
                element !== video &&
                !element.hasAttribute("data-sound-notice") &&
                (element.matches("button") || element.matches("div"))
              ) {
                element.remove();
              }
            });

            const walker = document.createTreeWalker(frame, NodeFilter.SHOW_TEXT);
            const viewerLabels = [];
            let textNode;
            while ((textNode = walker.nextNode())) {
              if (/^\d[\d.]*\s+assistindo$/.test(textNode.nodeValue.trim())) {
                viewerLabels.push(textNode);
              }
            }
            viewerLabels.forEach((label) => {
              const badge = label.parentElement?.closest("div");
              if (badge && badge !== frame) badge.remove();
            });

            const showSoundNotice = () => {
              if (!video.muted || frame.querySelector("[data-sound-notice]")) return;

              const notice = document.createElement("button");
              notice.type = "button";
              notice.dataset.soundNotice = "true";
              notice.textContent = "Clique aqui e ative o som";
              Object.assign(notice.style, {
                position: "absolute",
                left: "50%",
                top: "50%",
                zIndex: "20",
                transform: "translate(-50%, -50%)",
                border: "0",
                background: "transparent",
                color: "#ffffff",
                padding: "8px",
                fontSize: "14px",
                fontWeight: "700",
                lineHeight: "1.2",
                whiteSpace: "nowrap",
                cursor: "pointer",
                textShadow: "0 2px 8px rgba(0, 0, 0, 0.95)",
              });
              notice.addEventListener("click", (event) => {
                event.stopPropagation();
                video.muted = false;
                video.volume = 1;
                const playback = video.play();
                if (playback) playback.catch(() => {});
                notice.remove();
              });
              frame.append(notice);
            };

            const hideSoundNotice = () => {
              frame.querySelector("[data-sound-notice]")?.remove();
            };

            if (!video.dataset.soundToggleBound) {
              video.addEventListener("click", () => {
                if (!video.muted) {
                  video.muted = true;
                  showSoundNotice();
                }
              });
              video.dataset.soundToggleBound = "true";
            }

            if (video.muted) {
              showSoundNotice();
            } else {
              hideSoundNotice();
            }
          });
        };

        new MutationObserver(removeVideoOptions).observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true,
        });
        removeVideoOptions();
      })();
    </script>
  

</body></html>
