    <div id="root"></div>
    <script>
      (() => {
        const updateCount = () => {
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          const textNodes = [];
          let node;
          while ((node = walker.nextNode())) textNodes.push(node);
          textNodes.forEach((textNode) => {
            if (textNode.nodeValue.includes("2500")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("2500", "3000");
            }
            if (textNode.nodeValue.includes("Profissionais Para")) {
              textNode.nodeValue = textNode.nodeValue.replace("Profissionais Para", "Prontas Para");
            }
            if (textNode.nodeValue.includes("Atualizações Futuras")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Atualizações Futuras", "Atualizações Semanais");
            }
            if (textNode.nodeValue.includes("Atualizações Constantes")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Atualizações Constantes", "Atualizações Semanais");
            }
            if (textNode.nodeValue.includes("Novos designs adicionados todos os meses, sem custo extra.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Novos designs adicionados todos os meses, sem custo extra.",
                "Novas estampas adicionadas todas as semanas, sem custo extra."
              );
            }
            if (textNode.nodeValue.includes("Pastas categorizadas por tema e estilo para facilitar.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Pastas categorizadas por tema e estilo para facilitar.",
                "Pastas organizadas por tema e estilo para facilitar."
              );
            }
            if (textNode.nodeValue.includes("Download Instantâneo")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Download Instantâneo", "Acesso Imediato");
            }
            if (textNode.nodeValue.includes("Acesso liberado imediatamente após o pagamento.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Acesso liberado imediatamente após o pagamento.",
                "Acesso liberado imediatamente após a confirmação do pagamento."
              );
            }
            if (textNode.nodeValue.includes("Artes Disponíveis")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Artes Disponíveis", "Artes Inclusas");
            }
            if (textNode.nodeValue.includes("Mais de 3000 designs profissionais nas categorias mais vendidas do mercado.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Mais de 3000 designs profissionais nas categorias mais vendidas do mercado.",
                "Mais de 3000 estampas prontas nas categorias mais vendidas do mercado."
              );
            }
            if (textNode.nodeValue.includes("Tudo o que você precisa para começar a faturar com camisetas cristãs hoje mesmo.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Tudo o que você precisa para começar a faturar com camisetas cristãs hoje mesmo.",
                "Tudo o que você precisa para começar a criar e vender camisetas cristãs hoje mesmo."
              );
            }
            if (textNode.nodeValue.includes("Designs exclusivos e prontos para impressão para quem deseja criar ou expandir um negócio de camisetas cristãs.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Designs exclusivos e prontos para impressão para quem deseja criar ou expandir um negócio de camisetas cristãs.",
                "Estampas exclusivas e prontas para impressão para quem deseja criar ou expandir um negócio de camisetas cristãs."
              );
            }
          });
          document.querySelectorAll("h1").forEach((heading) => {
            const walker = document.createTreeWalker(heading, NodeFilter.SHOW_TEXT);
            let textNode;
            while ((textNode = walker.nextNode())) {
              const phrase = "Prontas Para Estampar e Vender";
              const index = textNode.nodeValue.indexOf(phrase);
              if (index === -1) continue;
              const fragment = document.createDocumentFragment();
              fragment.append(
                document.createTextNode(textNode.nodeValue.slice(0, index) + "Prontas Para")
              );
              const lineBreak = document.createElement("br");
              lineBreak.className = "headline-break";
              fragment.append(lineBreak);
              fragment.append(
                document.createTextNode(" Estampar e Vender" + textNode.nodeValue.slice(index + phrase.length))
              );
              textNode.replaceWith(fragment);
              break;
            }
          });
        };
        new MutationObserver(updateCount).observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true
        });
        updateCount();
      })();
    </script>
