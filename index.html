  <body>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1645160226740517&ev=PageView&noscript=1" alt="" /></noscript>
    <div id="root"></div>
    <script>
      (() => {
        const updateCount = () => {
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          const textNodes = [];
          let node;
          while ((node = walker.nextNode())) textNodes.push(node);
          textNodes.forEach((textNode) => {
            if (textNode.nodeValue.includes("2500")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("2500", "3000");
            }
            if (textNode.nodeValue.includes("Pacote Premium")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Pacote Premium", "Plano Premium");
            }
            if (textNode.nodeValue.includes("Atualizações Vitalícias")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Atualizações Vitalícias", "Atualizações Semanais");
            }
            if (textNode.nodeValue.includes("Suporte Prioritário")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Suporte Prioritário", "Suporte Exclusivo");
            }
            if (textNode.nodeValue.includes("Sem Bônus")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Sem Bônus", "Bônus Exclusivos");
            }
            if (textNode.nodeValue.includes("Profissionais Para")) {
              textNode.nodeValue = textNode.nodeValue.replace("Profissionais Para", "Prontas Para");
            }
            if (textNode.nodeValue.includes("Atualizações Futuras")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Atualizações Futuras", "Atualizações Semanais");
            }
            if (textNode.nodeValue.includes("Sem Atualizações Futuras")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Sem Atualizações Futuras", "Atualizações Semanais");
            }
            if (textNode.nodeValue.includes("Sem Atualizações Semanais")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Sem Atualizações Semanais", "Atualizações Semanais");
            }
            if (textNode.nodeValue.includes("Atualizações Constantes")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Atualizações Constantes", "Atualizações Semanais");
            }
            if (textNode.nodeValue.includes("Organização Profissional")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Organização Profissional", "Artes Organizadas");
            }
            if (textNode.nodeValue.includes("Veja alguns feedbacks reais de clientes que já estão utilizando as artes.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Veja alguns feedbacks reais de clientes que já estão utilizando as artes.",
                "Veja alguns depoimentos reais de clientes que estão utilizando as estampas."
              );
            }
            if (textNode.nodeValue.includes("3 bônus premium inclusos sem custo adicional.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "3 bônus premium inclusos sem custo adicional.",
                "3 bônus especiais inclusos sem custo adicional."
              );
            }
            if (textNode.nodeValue.includes("Mais de 50 fontes premium para suas estampas.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Mais de 50 fontes premium para suas estampas.",
                "Mais de 150 fontes exclusivas para suas estampas."
              );
            }
            if (textNode.nodeValue.includes("Calcule margem, custo e lucro com precisão.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Calcule margem, custo e lucro com precisão.",
                "Calcule seus custos, preço de venda e lucro com precisão."
              );
            }
            if (textNode.nodeValue.includes("Estratégia anual para vender em todas as datas.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Estratégia anual para vender em todas as datas.",
                "Planeje seu negócio para vender em todas as datas."
              );
            }
            if (textNode.nodeValue.includes("Novos designs adicionados todos os meses, sem custo extra.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Novos designs adicionados todos os meses, sem custo extra.",
                "Novas estampas adicionadas todas as semanas, sem custo extra."
              );
            }
            if (textNode.nodeValue.includes("Pastas categorizadas por tema e estilo para facilitar.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Pastas categorizadas por tema e estilo para facilitar.",
                "Pastas organizadas por tema e estilo para facilitar."
              );
            }
            if (textNode.nodeValue.includes("Download Instantâneo")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Download Instantâneo", "Acesso Imediato");
            }
            if (textNode.nodeValue.includes("Acesso liberado imediatamente após o pagamento.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Acesso liberado imediatamente após o pagamento.",
                "Acesso liberado imediatamente após a confirmação do pagamento."
              );
            }
            if (textNode.nodeValue.includes("Sem Suporte")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Sem Suporte", "Suporte Exclusivo");
            }
            if (textNode.nodeValue.includes("Suporte Exclusivos")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Suporte Exclusivos", "Suporte Exclusivo");
            }
            if (textNode.nodeValue.includes("Artes Disponíveis")) {
              textNode.nodeValue = textNode.nodeValue.replaceAll("Artes Disponíveis", "Artes Inclusas");
            }
            if (textNode.nodeValue.includes("Mais de 3000 designs profissionais nas categorias mais vendidas do mercado.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Mais de 3000 designs profissionais nas categorias mais vendidas do mercado.",
                "Mais de 3000 estampas prontas nas categorias mais vendidas do mercado."
              );
            }
            if (textNode.nodeValue.includes("Tudo o que você precisa para começar a faturar com camisetas cristãs hoje mesmo.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Tudo o que você precisa para começar a faturar com camisetas cristãs hoje mesmo.",
                "Tudo o que você precisa para começar a criar e vender camisetas cristãs hoje mesmo."
              );
            }
            if (textNode.nodeValue.includes("Designs exclusivos e prontos para impressão para quem deseja criar ou expandir um negócio de camisetas cristãs.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Designs exclusivos e prontos para impressão para quem deseja criar ou expandir um negócio de camisetas cristãs.",
                "Estampas exclusivas e prontas para impressão para quem deseja criar ou expandir um negócio de camisetas cristãs."
              );
            }
            if (textNode.nodeValue.includes("Escolha Seu Acesso")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Escolha Seu Acesso",
                "Escolha Seu Plano"
              );
            }
            if (textNode.nodeValue.includes("Invista apenas uma vez e tenha acesso imediato ao material.")) {
              textNode.nodeValue = textNode.nodeValue.replace(
                "Invista apenas uma vez e tenha acesso imediato ao material.",
                "Pague apenas uma vez e tenha acesso imediato ao material."
              );
            }
          });
          document.querySelectorAll("h3").forEach((heading) => {
            if (heading.textContent.includes("Pacote Premium")) {
              heading.childNodes.forEach((child) => {
                if (child.nodeType === Node.TEXT_NODE) {
                  child.nodeValue = child.nodeValue.replace("Pacote", "Plano");
                }
              });
            }
            const isBasicPlan = heading.textContent.includes("Plano Básico");
            const isPremiumPlan = heading.textContent.includes("Premium");
            if (!isBasicPlan && !isPremiumPlan) return;
            const card = heading.closest("div.reveal");
            const list = card && card.querySelector("ul");
            if (!list) return;
            const supportItem = Array.from(list.querySelectorAll("li")).find((item) =>
              item.textContent.includes("Suporte Exclusivo")
            );
            if (!supportItem || list.querySelector('[data-guarantee-item="true"]')) return;
            const guaranteeItem = supportItem.cloneNode(true);
            guaranteeItem.dataset.guaranteeItem = "true";
            const labels = guaranteeItem.querySelectorAll("span");
            if (labels.length > 1) {
              labels[labels.length - 1].textContent = "Garantia de 7 dias";
              if (isBasicPlan) labels[labels.length - 1].classList.add("line-through");
            }
            supportItem.before(guaranteeItem);
            if (isPremiumPlan && !list.querySelector('[data-bonus-item="true"]')) {
              const oldBonusItems = Array.from(list.querySelectorAll("li")).filter((item) =>
                item.textContent.includes("Todos os Bônus Inclusos") ||
                item.textContent.includes("Novas Coleções Futuras")
              );
              const bonusTemplate = oldBonusItems[0] || supportItem;
              oldBonusItems.forEach((item) => item.remove());
              const bonusAnchor = Array.from(list.querySelectorAll("li")).find((item) =>
                item.textContent.includes("Suporte Exclusivo")
              );
              if (bonusAnchor && bonusTemplate) {
                [
                  "Bônus 1: Pacote de 150 Fontes Cristãs",
                  "Bônus 2: Planilha de Custos e Precificação",
                  "Bônus 3: Calendário de Datas Cristãs"
                ].forEach((bonusText) => {
                  const bonusItem = bonusTemplate.cloneNode(true);
                  bonusItem.dataset.bonusItem = "true";
                  const bonusLabels = bonusItem.querySelectorAll("span");
                  if (bonusLabels.length > 1) {
                    bonusLabels[bonusLabels.length - 1].textContent = bonusText;
                  }
                  bonusAnchor.before(bonusItem);
                });
              }
            }
          });
          document.querySelectorAll("h2").forEach((heading) => {
            if (heading.textContent.includes("Escolha Seu Acesso")) {
              heading.querySelectorAll("span").forEach((span) => {
                if (span.textContent.trim() === "Acesso") span.textContent = "Plano";
              });
            }
          });
          document.querySelectorAll("h1").forEach((heading) => {
            const walker = document.createTreeWalker(heading, NodeFilter.SHOW_TEXT);
            let textNode;
            while ((textNode = walker.nextNode())) {
              const phrase = "Prontas Para Estampar e Vender";
              const index = textNode.nodeValue.indexOf(phrase);
              if (index === -1) continue;
              const fragment = document.createDocumentFragment();
              fragment.append(
                document.createTextNode(textNode.nodeValue.slice(0, index) + "Prontas Para")
              );
              const lineBreak = document.createElement("br");
              lineBreak.className = "headline-break";
              fragment.append(lineBreak);
              fragment.append(
                document.createTextNode(" Estampar e Vender" + textNode.nodeValue.slice(index + phrase.length))
              );
              textNode.replaceWith(fragment);
              break;
            }
          });
        };
        new MutationObserver(updateCount).observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true
        });
        updateCount();
      })();
    </script>
